<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Caza de Cubos AR</title>
  <style>
    * {
      touch-action: manipulation;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    body {
      margin: 0;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #000;
    }

    /* Vídeo de la cámara de fondo */
    #camera-feed {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    /* Canvas 3D de Three.js */
    #canvas-3d {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: auto;
    }

    /* Interfaz de usuario (Marcador y Botones) */
    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 30px 20px;
      box-sizing: border-box;
    }

    .hud {
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(10px);
      padding: 12px 24px;
      border-radius: 25px;
      font-size: 20px;
      font-weight: bold;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .btn-start {
      pointer-events: auto;
      background: #007AFF;
      color: white;
      border: none;
      padding: 16px 36px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 30px;
      box-shadow: 0 4px 15px rgba(0, 122, 255, 0.5);
      cursor: pointer;
    }

    #error-msg {
      pointer-events: auto;
      background: rgba(200, 30, 30, 0.85);
      color: #fff;
      padding: 12px 20px;
      border-radius: 14px;
      font-size: 14px;
      max-width: 80%;
      text-align: center;
      display: none;
    }

    #hand-cursor {
      position: absolute;
      width: 28px;
      height: 28px;
      margin-left: -14px;
      margin-top: -14px;
      border-radius: 50%;
      border: 3px solid #00E0FF;
      background: rgba(0, 224, 255, 0.25);
      z-index: 4;
      pointer-events: none;
      display: none;
      transition: background 0.1s, border-color 0.1s;
    }
    #hand-cursor.pinching {
      border-color: #39FF6A;
      background: rgba(57, 255, 106, 0.4);
    }
  </style>

  <!-- Three.js para renderizado 3D e interacciones -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <!-- Elemento para reproducir la cámara en tiempo real -->
  <video id="camera-feed" autoplay playsinline muted></video>

  <!-- Canvas donde se renderizan los cubos interactivos -->
  <canvas id="canvas-3d"></canvas>

  <!-- Puntero visual que sigue al dedo índice cuando se detecta la mano -->
  <div id="hand-cursor"></div>

  <!-- Marcador de Puntos -->
  <div id="ui-layer">
    <div class="hud">Puntos: <span id="score-text">0</span> 🎯</div>
    <div id="error-msg"></div>
    <button id="start-btn" class="btn-start">¡Empezar a Jugar! 🚀</button>
  </div>

  <script>
    let camera, scene, renderer;
    let raycaster, mouse;
    let score = 0;
    const targets = [];
    const canvas3D = document.getElementById('canvas-3d');
    const startBtn = document.getElementById('start-btn');
    const errorMsg = document.getElementById('error-msg');

    // Orientación de referencia (para "calibrar" el cero al empezar)
    let baseOrientation = null;
    let currentOrientation = { alpha: 0, beta: 0, gamma: 0 };

    init();

    function init() {
      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 0, 0);
      camera.rotation.order = 'YXZ'; // orden correcto para mapear el giroscopio

      renderer = new THREE.WebGLRenderer({ canvas: canvas3D, alpha: true, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      const light = new THREE.DirectionalLight(0xffffff, 1);
      light.position.set(1, 1, 1).normalize();
      scene.add(light);
      scene.add(new THREE.AmbientLight(0xffffff, 0.5));

      raycaster = new THREE.Raycaster();
      mouse = new THREE.Vector2();

      canvas3D.addEventListener('pointerdown', onTapCube);
      startBtn.addEventListener('click', startGame);

      window.addEventListener('resize', onWindowResize);
    }

    function showError(text) {
      errorMsg.textContent = text;
      errorMsg.style.display = 'block';
    }

    // Iniciar cámara + giroscopio y generar cubos
    async function startGame() {
      startBtn.style.display = 'none';

      // 1. Permiso de orientación del dispositivo — PRIMERO y SIN ningún
      // await por delante, porque en iOS el gesto de usuario del click
      // caduca en cuanto se resuelve cualquier otra promesa (como la de
      // la cámara). Tiene que ser literalmente lo primero que se ejecuta.
      if (typeof DeviceOrientationEvent !== 'undefined' &&
          typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const permission = await DeviceOrientationEvent.requestPermission();
          if (permission === 'granted') {
            window.addEventListener('deviceorientation', onDeviceOrientation);
          } else {
            showError('Permiso de orientación denegado: los cubos no se quedarán anclados al moverte.');
          }
        } catch (err) {
          showError('Este navegador no permitió pedir el giroscopio: ' + err.message);
        }
      } else {
        // Android / navegadores sin el gate de permiso explícito
        window.addEventListener('deviceorientation', onDeviceOrientation);
      }

      // 2. Cámara trasera (esto sí puede ir después, getUserMedia es
      // más tolerante con el gesto de usuario ya "gastado")
      const videoEl = document.getElementById('camera-feed');
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { exact: "environment" } },
          audio: false
        });
        await attachStream(videoEl, stream);
      } catch (err) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
          await attachStream(videoEl, stream);
        } catch (err2) {
          showError('No se pudo acceder a la cámara: ' + err2.message + '. Revisa que estés en HTTPS y hayas dado permiso.');
        }
      }

      spawnCubes(8);
      animate();
      if (window.enableHandTracking) window.enableHandTracking(videoEl);
    }

    // Asigna el stream y fuerza el play() explícito: tras varios awaits
    // (permiso de giroscopio, permiso de cámara) Safari a veces ya no
    // considera "reciente" el gesto de usuario y el autoplay silencioso
    // no arranca solo con los atributos autoplay/muted/playsinline.
    async function attachStream(videoEl, stream) {
      videoEl.srcObject = stream;
      try {
        await videoEl.play();
      } catch (err) {
        showError('El vídeo no arrancó solo, toca la pantalla para activarlo.');
        const resumeOnce = () => { videoEl.play(); document.removeEventListener('pointerdown', resumeOnce); };
        document.addEventListener('pointerdown', resumeOnce);
      }
    }

    // Guarda los ángulos crudos del giroscopio
    function onDeviceOrientation(event) {
      if (event.alpha === null) return; // sensor no disponible

      if (baseOrientation === null) {
        // Calibra el "frente" en el momento de empezar a jugar
        baseOrientation = { alpha: event.alpha, beta: event.beta, gamma: event.gamma };
      }

      currentOrientation.alpha = event.alpha;
      currentOrientation.beta = event.beta;
      currentOrientation.gamma = event.gamma;
    }

    // Aplica la orientación a la cámara de Three.js cada frame
    function updateCameraFromOrientation() {
      if (baseOrientation === null) return;

      const alpha = THREE.MathUtils.degToRad(currentOrientation.alpha - baseOrientation.alpha);
      const beta = THREE.MathUtils.degToRad(currentOrientation.beta);
      const gamma = THREE.MathUtils.degToRad(currentOrientation.gamma);

      // Mapeo simplificado: yaw = alpha, pitch = beta, roll = gamma
      camera.rotation.set(beta - Math.PI / 2, gamma, -alpha, 'YXZ');
    }

    function spawnCubes(count) {
      const geometry = new THREE.BoxGeometry(0.3, 0.3, 0.3);

      for (let i = 0; i < count; i++) {
        const material = new THREE.MeshPhongMaterial({
          color: Math.random() * 0xffffff,
          shininess: 90
        });

        const cube = new THREE.Mesh(geometry, material);

        cube.position.x = (Math.random() - 0.5) * 3;
        cube.position.y = (Math.random() - 0.5) * 2;
        cube.position.z = -1.5 - Math.random() * 2;

        cube.userData = {
          rotX: (Math.random() - 0.5) * 0.03,
          rotY: (Math.random() - 0.5) * 0.03
        };

        scene.add(cube);
        targets.push(cube);
      }
    }

    function onTapCube(event) {
      triggerTapAtClientXY(event.clientX, event.clientY);
    }

    // Misma lógica de "romper cubo", pero reutilizable tanto por el
    // toque en pantalla como por el gesto de pellizco de la mano.
    function triggerTapAtClientXY(clientX, clientY) {
      mouse.x = (clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(targets);

      if (intersects.length > 0) {
        const hitCube = intersects[0].object;

        hitCube.scale.set(0.01, 0.01, 0.01);
        scene.remove(hitCube);
        targets.splice(targets.indexOf(hitCube), 1);

        score += 10;
        document.getElementById('score-text').textContent = score;

        spawnCubes(1);
      }
    }
    window.triggerTapAtClientXY = triggerTapAtClientXY;

    function animate() {
      requestAnimationFrame(animate);

      updateCameraFromOrientation();

      targets.forEach(cube => {
        cube.rotation.x += cube.userData.rotX;
        cube.rotation.y += cube.userData.rotY;
      });

      renderer.render(scene, camera);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
  </script>

  <!-- Detección de mano (pellizco pulgar-índice) usando MediaPipe Tasks Vision.
       Va en un <script type="module"> aparte porque la librería se importa
       como módulo ES; se comunica con el script principal a través de
       funciones colgadas de window (triggerTapAtClientXY, etc.). -->
  <script type="module">
    import {
      HandLandmarker,
      FilesetResolver
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

    const PINCH_THRESHOLD = 0.06; // distancia normalizada pulgar-índice para considerar "pellizco"
    const handCursor = document.getElementById('hand-cursor');

    let handLandmarker = null;
    let lastVideoTime = -1;
    let wasPinching = false;
    let running = false;

    // Mapea coordenadas normalizadas del vídeo (0-1) a coordenadas de
    // pantalla reales, compensando el recorte que hace object-fit: cover.
    function videoToScreenXY(videoEl, nx, ny) {
      const vw = videoEl.videoWidth, vh = videoEl.videoHeight;
      const ww = window.innerWidth, wh = window.innerHeight;
      if (!vw || !vh) return { x: nx * ww, y: ny * wh };

      const videoRatio = vw / vh;
      const winRatio = ww / wh;

      if (winRatio > videoRatio) {
        const scale = ww / vw;
        const offsetY = (vh * scale - wh) / 2;
        return { x: nx * vw * scale, y: ny * vh * scale - offsetY };
      } else {
        const scale = wh / vh;
        const offsetX = (vw * scale - ww) / 2;
        return { x: nx * vw * scale - offsetX, y: ny * vh * scale };
      }
    }

    window.enableHandTracking = async function(videoEl) {
      if (running) return;
      running = true;
      try {
        const vision = await FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
        );
        handLandmarker = await HandLandmarker.createFromOptions(vision, {
          baseOptions: {
            modelAssetPath:
              "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
            delegate: "GPU"
          },
          runningMode: "VIDEO",
          numHands: 1
        });
        detectLoop(videoEl);
      } catch (err) {
        // Si el modelo no carga (sin red, navegador sin WebGL para el
        // delegate GPU, etc.) el juego sigue funcionando solo con el
        // toque en pantalla — esto no debe romper nada más.
        window.showError && window.showError('No se pudo activar el control por mano: ' + err.message);
      }
    };

    function detectLoop(videoEl) {
      requestAnimationFrame(() => detectLoop(videoEl));
      if (!handLandmarker || videoEl.readyState < 2) return;
      if (videoEl.currentTime === lastVideoTime) return;
      lastVideoTime = videoEl.currentTime;

      const results = handLandmarker.detectForVideo(videoEl, performance.now());

      if (!results.landmarks || results.landmarks.length === 0) {
        handCursor.style.display = 'none';
        wasPinching = false;
        return;
      }

      const lm = results.landmarks[0];
      const thumbTip = lm[4];
      const indexTip = lm[8];

      // Punto medio entre pulgar e índice: ahí "apunta" la mano
      const midX = (thumbTip.x + indexTip.x) / 2;
      const midY = (thumbTip.y + indexTip.y) / 2;
      const { x: screenX, y: screenY } = videoToScreenXY(videoEl, midX, midY);

      handCursor.style.display = 'block';
      handCursor.style.left = screenX + 'px';
      handCursor.style.top = screenY + 'px';

      const dist = Math.hypot(thumbTip.x - indexTip.x, thumbTip.y - indexTip.y);
      const isPinching = dist < PINCH_THRESHOLD;
      handCursor.classList.toggle('pinching', isPinching);

      // Disparo solo en el flanco de subida (al cerrar el pellizco),
      // no en cada frame que sigues pellizcando.
      if (isPinching && !wasPinching && window.triggerTapAtClientXY) {
        window.triggerTapAtClientXY(screenX, screenY);
      }
      wasPinching = isPinching;
    }
  </script>
</body>
</html>
