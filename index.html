<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Caza de Cubos AR</title>
  <style>
    * {
      touch-action: manipulation;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    body {
      margin: 0;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #000;
    }

    /* Vídeo de la cámara de fondo */
    #camera-feed {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    /* Canvas 3D de Three.js */
    #canvas-3d {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: auto;
    }

    /* Interfaz de usuario (Marcador y Botones) */
    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 30px 20px;
      box-sizing: border-box;
    }

    .hud {
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(10px);
      padding: 12px 24px;
      border-radius: 25px;
      font-size: 20px;
      font-weight: bold;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .btn-start {
      pointer-events: auto;
      background: #007AFF;
      color: white;
      border: none;
      padding: 16px 36px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 30px;
      box-shadow: 0 4px 15px rgba(0, 122, 255, 0.5);
      cursor: pointer;
    }
  </style>

  <!-- Three.js para renderizado 3D e interacciones -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <!-- Elemento para reproducir la cámara en tiempo real -->
  <video id="camera-feed" autoplay playsinline muted></video>

  <!-- Canvas donde se renderizan los cubos interactivos -->
  <canvas id="canvas-3d"></canvas>

  <!-- Marcador de Puntos -->
  <div id="ui-layer">
    <div class="hud">Puntos: <span id="score-text">0</span> 🎯</div>
    <button id="start-btn" class="btn-start">¡Empezar a Jugar! 🚀</button>
  </div>

  <script>
    let camera, scene, renderer;
    let raycaster, mouse;
    let score = 0;
    const targets = [];
    const canvas3D = document.getElementById('canvas-3d');
    const startBtn = document.getElementById('start-btn');

    init();

    function init() {
      // 1. Escena 3D
      scene = new THREE.Scene();

      // 2. Cámara 3D
      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 0, 0);

      // 3. Renderizador WebGL transparente
      renderer = new THREE.WebGLRenderer({ canvas: canvas3D, alpha: true, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      // 4. Luces
      const light = new THREE.DirectionalLight(0xffffff, 1);
      light.position.set(1, 1, 1).normalize();
      scene.add(light);
      scene.add(new THREE.AmbientLight(0xffffff, 0.5));

      // 5. Detectores de toques (Raycaster)
      raycaster = new THREE.Raycaster();
      mouse = new THREE.Vector2();

      // Listeners de eventos de toque
      canvas3D.addEventListener('pointerdown', onTapCube);
      startBtn.addEventListener('click', startGame);

      window.addEventListener('resize', onWindowResize);
    }

    // Iniciar la cámara nativa del móvil y generar cubos
    async function startGame() {
      startBtn.style.display = 'none';

      try {
        // Pedir permiso de cámara trasera al móvil
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { exact: "environment" } },
          audio: false
        });
        document.getElementById('camera-feed').srcObject = stream;
      } catch (err) {
        // Fallback si no hay cámara trasera especificada
        const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        document.getElementById('camera-feed').srcObject = stream;
      }

      // Generar 8 cubos iniciales a tu alrededor
      spawnCubes(8);

      // Iniciar el bucle de renderizado
      animate();
    }

    // Generar cubos flotantes en posiciones aleatorias alrededor del usuario
    function spawnCubes(count) {
      const geometry = new THREE.BoxGeometry(0.3, 0.3, 0.3); // Cubos de 30 cm

      for (let i = 0; i < count; i++) {
        const material = new THREE.MeshPhongMaterial({
          color: Math.random() * 0xffffff,
          shininess: 90
        });

        const cube = new THREE.Mesh(geometry, material);

        // Dispersar en un radio alrededor de la cámara (X, Y, Z)
        cube.position.x = (Math.random() - 0.5) * 3;
        cube.position.y = (Math.random() - 0.5) * 2;
        cube.position.z = -1.5 - Math.random() * 2; // Delante de la cámara

        // Velocidades de rotación propias
        cube.userData = {
          rotX: (Math.random() - 0.5) * 0.03,
          rotY: (Math.random() - 0.5) * 0.03
        };

        scene.add(cube);
        targets.push(cube);
      }
    }

    // Evento al tocar la pantalla para "romper" un cubo
    function onTapCube(event) {
      // Convertir las coordenadas de la pantalla a coordenadas 3D (-1 a 1)
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(targets);

      if (intersects.length > 0) {
        const hitCube = intersects[0].object;

        // 1. Efecto visual: Encoger rápido y eliminar
        hitCube.scale.set(0.01, 0.01, 0.01);
        scene.remove(hitCube);
        targets.splice(targets.indexOf(hitCube), 1);

        // 2. Sumar puntos
        score += 10;
        document.getElementById('score-text').textContent = score;

        // 3. Crear un nuevo cubo en otra posición aleatoria
        spawnCubes(1);
      }
    }

    function animate() {
      requestAnimationFrame(animate);

      // Rotar los cubos continuamente
      targets.forEach(cube => {
        cube.rotation.x += cube.userData.rotX;
        cube.rotation.y += cube.userData.rotY;
      });

      renderer.render(scene, camera);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
  </script>
</body>
</html>
